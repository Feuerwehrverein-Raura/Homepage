# DEUTSCH: Nginx-Konfiguration für die Frontend-Website (fwv-raura.ch)
# DEUTSCH: Läuft im Docker-Container, Traefik leitet den Traffic hierher weiter
server {
    listen 80;                                    # DEUTSCH: Port 80 intern (Traefik macht HTTPS)
    server_name _;                                # DEUTSCH: Akzeptiert alle Hostnamen
    root /usr/share/nginx/html;                   # DEUTSCH: Statische Dateien aus dem Docker-Image
    index index.html;

    # DEUTSCH: Komprimieren - vor allem fuer die Mitglieder-App unter /mein/
    # (main.dart.js 5 MB, canvaskit.wasm 7 MB unkomprimiert), hilft aber auch
    # allen anderen Seiten. Bilder und PDFs sind schon komprimiert.
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/css application/javascript application/json application/wasm image/svg+xml text/plain;

    # DEUTSCH: HTML-Seiten NICHT cachen — der Browser muss bei jedem Aufruf die aktuelle
    # Version holen. Sonst laufen Deploys ins Leere, weil eine alte vorstand.html/mein.html
    # im Browser-Cache steckt (genau das hat die Brief-Vorlage-Aenderung "verschluckt").
    location ~* \.html$ {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri /index.html;
    }

    # DEUTSCH: SPA-Fallback — alle Pfade die keine Datei finden werden auf index.html umgeleitet
    # DEUTSCH: Nötig damit Unterseiten wie /vorstand.html oder /mein.html direkt aufgerufen werden können
    location / {
        try_files $uri $uri/ /index.html;
    }

    # DEUTSCH: Eigene Skripte (scripts/) aendern sich mit jedem Deploy, haben aber
    # keinen Hash im Namen. Mit der 1-Jahr-Regel unten behielten Browser die alte
    # Fassung — passiert mit arbeitsplan.js. Deshalb wie HTML jedes Mal pruefen
    # (ETag: unveraendert = kurze 304-Antwort). ^~ hat Vorrang vor den Regex-Regeln.
    # DEUTSCH: App-Downloads (mitglieder.apk, kueche.apk, versionen.json) - legt
    # der Vereinsserver ab (docker/app-downloads/holen.sh, Volume). apk ist in
    # mime.types nicht bekannt; ohne den Typ erkennt Android die Datei nicht
    # als App. versionen.json duerfen auch die Apps selbst abfragen.
    location ^~ /download/ {
        types {
            application/vnd.android.package-archive apk;
            application/json json;
        }
        add_header Cache-Control "no-cache, must-revalidate";
        add_header Access-Control-Allow-Origin "*";
        try_files $uri =404;
    }

    location ^~ /scripts/ {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # DEUTSCH: Die Mitglieder-App im Browser (Flutter Web, eingebettet in
    # mein.html). main.dart.js & Co. haben keinen Hash im Namen - mit der
    # 1-Jahr-Regel unten saehe niemand ein Update. Darum wie scripts/ jedes Mal
    # pruefen (ETag, unveraendert = 304).
    location ^~ /mein/ {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri $uri/ /mein/index.html;
    }

    # DEUTSCH: Statische Assets (JS, CSS, Bilder, Fonts) werden 1 Jahr gecacht
    # DEUTSCH: "immutable" = Browser muss nie erneut prüfen ob die Datei aktuell ist
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # DEUTSCH: PDF-Dateien werden 1 Monat gecacht (z.B. Kalender, Arbeitspläne)
    location ~* \.pdf$ {
        expires 1M;
        add_header Cache-Control "public";
    }

    # DEUTSCH: Konfigurationsprofil fuer das CardDAV-Adressbuch.
    # DEUTSCH: Der Content-Type ist hier nicht Kosmetik — nur bei
    # DEUTSCH: application/x-apple-aspen-config bietet Safari die Installation
    # DEUTSCH: an. Mit dem Standardtyp zeigt es die Datei bloss als Text an.
    # DEUTSCH: Kein Caching, damit Aenderungen am Profil sofort ankommen.
    location = /carddav.mobileconfig {
        default_type application/x-apple-aspen-config;
        add_header Cache-Control "no-cache, must-revalidate";
    }
}
