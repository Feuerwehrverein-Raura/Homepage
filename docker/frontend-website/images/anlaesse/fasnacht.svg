<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
<!-- Platzhalter-Logo Fasnacht (13.10.2026): Basler Trommel mit Schlegeln und
     Raeppli in den Farben der Chaiseraugschter Fasnacht (Gelb, Violett, Rot,
     Magenta - angelehnt, nicht deren Logo). Ring in Vereinsrot #B91C1C.
     Durch ein echtes Logo ersetzen: gleiche Datei, 512x512. -->
<defs>
  <!-- Raeppli-Formen wie auf chaiseraugschter-fasnacht.ch: Kreuz mit runden
       Enden, Kissen mit eingebuchteten Seiten, Kreis -->
  <path id="kreuz" d="M-9 -24 h18 a9 9 0 0 1 9 9 v6 h6 a9 9 0 0 1 9 9 v18 a9 9 0 0 1 -9 9 h-6 v6 a9 9 0 0 1 -9 9 h-18 a9 9 0 0 1 -9 -9 v-6 h-6 a9 9 0 0 1 -9 -9 v-18 a9 9 0 0 1 9 -9 h6 v-6 a9 9 0 0 1 9 -9 Z" transform="translate(0 -3)"/>
  <path id="kissen" d="M-22 -22 Q0 -12 22 -22 Q12 0 22 22 Q0 12 -22 22 Q-12 0 -22 -22 Z"/>
</defs>
<circle cx="256" cy="256" r="248" fill="#B91C1C"/>
<circle cx="256" cy="256" r="222" fill="#FFF8EC"/>
<!-- grosse Raeppli -->
<use href="#kreuz" fill="#F1E600" transform="translate(116 176) scale(1.15)"/>
<use href="#kissen" fill="#C0000B" transform="translate(398 166) rotate(12) scale(1.1)"/>
<circle cx="110" cy="252" r="20" fill="#5B1A82"/>
<use href="#kissen" fill="#C3005E" transform="translate(404 252) rotate(-8) scale(0.7)"/>
<!-- kleine Raeppli -->
<use href="#kreuz" fill="#C3005E" transform="translate(182 84) scale(0.5)"/>
<circle cx="330" cy="86" r="10" fill="#F1E600"/>
<use href="#kissen" fill="#5B1A82" transform="translate(256 70) scale(0.42)"/>
<circle cx="146" cy="306" r="9" fill="#C0000B"/>
<use href="#kreuz" fill="#5B1A82" transform="translate(372 310) scale(0.45)"/>
<!-- Schlegel, gekreuzt hinter der Trommel -->
<g stroke="#5B1A82" stroke-width="11" stroke-linecap="round">
<line x1="172" y1="104" x2="300" y2="226"/><line x1="340" y1="104" x2="212" y2="226"/>
</g>
<g fill="#5B1A82"><circle cx="170" cy="102" r="15"/><circle cx="342" cy="102" r="15"/></g>
<!-- Trommel -->
<rect x="152" y="200" width="208" height="128" fill="#C3005E"/>
<ellipse cx="256" cy="328" rx="104" ry="28" fill="#5B1A82"/>
<rect x="152" y="300" width="208" height="28" fill="#5B1A82"/>
<rect x="152" y="200" width="208" height="26" fill="#5B1A82"/>
<path d="M164 226 L190 300 L216 226 L242 300 L268 226 L294 300 L320 226 L346 300" fill="none" stroke="#F1E600" stroke-width="8" stroke-linejoin="round"/>
<ellipse cx="256" cy="200" rx="104" ry="28" fill="#F4F1EA" stroke="#5B1A82" stroke-width="6"/>
<text x="256" y="412" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-weight="700" font-size="56" letter-spacing="2" fill="#B91C1C">FASNACHT</text>
</svg>
