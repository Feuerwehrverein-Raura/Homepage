<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
<!-- Platzhalter-Logo Fasnacht (13.10.2026): Basler Trommel mit Schlegeln und
     Raeppli. Vereinsrot #B91C1C. Durch ein echtes Logo ersetzen: gleiche Datei, 512x512. -->
<circle cx="256" cy="256" r="248" fill="#B91C1C"/>
<circle cx="256" cy="256" r="226" fill="none" stroke="#fff" stroke-width="8"/>
<!-- Raeppli -->
<g fill="#fff">
<circle cx="118" cy="168" r="7"/><circle cx="150" cy="120" r="6"/><circle cx="392" cy="160" r="7"/><circle cx="362" cy="116" r="6"/>
<circle cx="104" cy="250" r="6"/><circle cx="410" cy="246" r="6"/><circle cx="196" cy="96" r="5"/><circle cx="318" cy="94" r="5"/>
<circle cx="132" cy="300" r="5"/><circle cx="384" cy="300" r="5"/>
</g>
<!-- Schlegel, gekreuzt hinter der Trommel -->
<g stroke="#fff" stroke-width="11" stroke-linecap="round">
<line x1="168" y1="96" x2="300" y2="226"/><line x1="344" y1="96" x2="212" y2="226"/>
</g>
<g fill="#fff"><circle cx="166" cy="94" r="15"/><circle cx="346" cy="94" r="15"/></g>
<!-- Trommel: Koerper mit Zickzack-Schnuerung, Reifen oben und unten -->
<ellipse cx="256" cy="200" rx="104" ry="28" fill="#fff"/>
<rect x="152" y="200" width="208" height="128" fill="#fff"/>
<ellipse cx="256" cy="328" rx="104" ry="28" fill="#fff"/>
<rect x="152" y="208" width="208" height="12" fill="#B91C1C"/>
<rect x="152" y="306" width="208" height="12" fill="#B91C1C"/>
<path d="M164 222 L190 304 L216 222 L242 304 L268 222 L294 304 L320 222 L346 304" fill="none" stroke="#B91C1C" stroke-width="7" stroke-linejoin="round"/>
<ellipse cx="256" cy="200" rx="104" ry="28" fill="none" stroke="#B91C1C" stroke-width="5"/>
<text x="256" y="412" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-weight="700" font-size="56" letter-spacing="2" fill="#fff">FASNACHT</text>
</svg>
