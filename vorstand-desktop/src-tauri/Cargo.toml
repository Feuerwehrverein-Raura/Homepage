[package]
name = "vorstand-desktop"
version = "1.28.0"
description = "FWV Vorstand Desktop App"
authors = ["FWV Raura"]
edition = "2021"

[lib]
name = "vorstand_desktop_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-store = "2"
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-http = { version = "2", features = ["rustls-tls"] }
open = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
ring = "0.17"
aes = "0.8"
cbc = "0.1"
hmac = "0.12"
sha2 = "0.10"
rsa = "0.9"
pkcs8 = { version = "0.10", features = ["encryption"] }
hkdf = "0.12"

# keyring hat KEINE Default-Features: ohne passendes Plattform-Feature faellt
# die Crate still auf den In-Memory-"mock"-Store zurueck — das JWT waere dann
# nach jedem App-Neustart weg. Darum pro Zielplattform explizit setzen.
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["linux-native"] }
