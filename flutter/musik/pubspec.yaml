name: fwv_musik
description: "FWV Musik — Playlists, Radiosender und Player des Roten Schopfs als Desktop-Programm"
publish_to: 'none'

# Wird beim Release aus dem Tag musik-v* gesetzt (--build-name).
version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  fwv_core:
    path: ../fwv_core
  fwv_anlass:
    path: ../fwv_anlass
  # Playlist-Editor, Radiosender, Player und "Im Schopf" - dieselben
  # Bildschirme wie in der Mitglieder-App.
  fwv_roterschopf:
    path: ../fwv_roterschopf
  material_ui: ^1.6.0
  http: ^1.6.0
  url_launcher: ^6.3.3
  # Gespeicherte Musik (Application Support/Musik), siehe lib/dienste.dart.
  path_provider: ^2.1.6
  # macOS: Bedienung ueber Medientasten und "Jetzt laeuft".
  just_audio_background: ^0.0.1-beta.17
  # Linux und Windows: just_audio hat dort kein eigenes Plugin; media_kit
  # (libmpv) spielt statt dessen. Linux braucht dafuer libmpv auf dem
  # System, Windows bringt die Bibliothek mit.
  just_audio_media_kit: ^2.1.0
  media_kit_libs_linux: ^1.2.1
  media_kit_libs_windows_audio: ^1.0.9

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
