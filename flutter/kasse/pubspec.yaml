name: kasse
description: "Kasse des FWV Raura - native App fuer Anlaesse (Bar, Tische, Bons am T400)."
publish_to: 'none'
# Version setzt der Release-Workflow aus dem Tag kasse-vX.Y[.Z]
version: 2.0.0+2000

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  http: ^1.6.0
  # Gleiche Version wie flutter/mitglieder (QR-Login)
  mobile_scanner: ^7.4.2
  # Kiosk: Bildschirm bleibt an
  wakelock_plus: ^1.8.1
  # Anmeldung und Puffer ueberleben einen Neustart der App
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
