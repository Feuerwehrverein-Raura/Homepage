# Abspielwerk fuer den Roten Schopf.
#
# Laeuft als SYSTEMDIENST mit direktem Zugriff auf die Soundkarte, nicht
# ueber PulseAudio. Grund: PulseAudio haengt an der Benutzersitzung — meldet
# sich jemand ab, ist die Tonausgabe weg. Die Musik soll aber laufen,
# unabhaengig davon, wer angemeldet ist oder ob ueberhaupt jemand.

music_directory     "/Musik"
playlist_directory  "/var/lib/mpd/playlists"
db_file             "/var/lib/mpd/tag_cache"
state_file          "/var/lib/mpd/state"
sticker_file        "/var/lib/mpd/sticker.sql"

user                "mpd"
bind_to_address     "127.0.0.1"
port                "6600"

# Bibliothek beim Start einlesen, damit neu abgelegte Stuecke ohne Zutun
# auftauchen.
auto_update         "yes"
auto_update_depth   "3"

# --- Die drei Eigenschaften aus der Anforderung ---------------------------

# 1. Kurzer Uebergang: crossfade ist KEINE Einstellung dieser Datei,
#    sondern eine Laufzeit-Einstellung. Sie wird mit "mpc crossfade 2"
#    gesetzt und landet im state_file, ueberlebt also Neustarts.

# 2. Lautstaerke angleichen. "auto" nutzt vorhandene ReplayGain-Angaben,
#    "album" wo vorhanden, sonst pro Stueck. Fehlen die Angaben in den
#    Dateien, greift die Grenzwertregelung darunter.
replaygain          "auto"
replaygain_preamp   "0"
volume_normalization "yes"

# 3. Zufallswiedergabe wird beim Start gesetzt (siehe mpd-startzustand),
#    nicht hier — MPD merkt sich den Zustand sonst quer ueber Neustarts.

audio_output {
    type            "alsa"
    name            "Klinke Roter Schopf"
    # Kein device-Eintrag: MPD nimmt die Standardkarte. Auf dem T400 ist
    # das die eingebaute, an der die Anlage haengt.
    mixer_type      "software"
}

# Kein Zeroconf-Gedudel im fremden WLAN.
zeroconf_enabled    "no"
