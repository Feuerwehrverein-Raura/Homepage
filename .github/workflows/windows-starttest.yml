# Starttest des Windows-Programms der Mitglieder-App: baut Release und
# Debug, startet beide, macht nach 30 s ein Bildschirmfoto und sammelt die
# Ausgabe (Konsole, Ereignisprotokoll). Laeuft nur von Hand oder bei Push
# auf test/windows-start - kein Release.

on:
  workflow_dispatch:
  push:
    branches: ['test/windows-start']

jobs:
  start:
    name: Windows starten
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
        working-directory: flutter/mitglieder
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - name: Bauen
        run: |
          flutter pub get
          flutter build windows --release
          flutter build windows --debug
          cd ../musik && flutter pub get && flutter build windows --release

      - name: Starten und pruefen
        run: |
          New-Item -ItemType Directory -Force "$env:GITHUB_WORKSPACE\starttest" | Out-Null
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $m = "$PWD\build\windows\x64\runner"
          $proben = @{
            'Release' = "$m\Release\fwv_mitglieder.exe"
            'Debug' = "$m\Debug\fwv_mitglieder.exe"
            'Musik' = "$PWD\..\musik\build\windows\x64\runner\Release\fwv_musik.exe"
          }
          foreach ($art in 'Release', 'Debug', 'Musik') {
            $exe = $proben[$art]
            $log = "$env:GITHUB_WORKSPACE\starttest\$art"
            Write-Host "=== $art ($exe)"
            $p = Start-Process $exe -PassThru -WorkingDirectory (Split-Path $exe) `
              -RedirectStandardOutput "$log-stdout.txt" -RedirectStandardError "$log-stderr.txt"
            Start-Sleep 30
            $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bild = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            [System.Drawing.Graphics]::FromImage($bild).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
            $bild.Save("$log.png")
            $p.Refresh()
            Write-Host "Beendet: $($p.HasExited)  Exitcode: $(if ($p.HasExited) { $p.ExitCode })  Fenster: '$($p.MainWindowTitle)'"
            if (-not $p.HasExited) { Stop-Process $p -Force }
            Start-Sleep 2
            Write-Host "--- stdout"; Get-Content "$log-stdout.txt" -ErrorAction SilentlyContinue
            Write-Host "--- stderr"; Get-Content "$log-stderr.txt" -ErrorAction SilentlyContinue
          }
          Write-Host "=== Ereignisprotokoll (Anwendungsfehler)"
          Get-WinEvent -FilterHashtable @{LogName='Application'; Level=1,2; StartTime=(Get-Date).AddMinutes(-5)} -ErrorAction SilentlyContinue |
            Format-List TimeCreated, ProviderName, Message | Out-String -Width 300 | Write-Host

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: starttest
          path: starttest
