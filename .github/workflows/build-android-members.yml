name: Build Android Members

# Release der Mitglieder-App fuer Android — seit members-v1.0.0 die
# Flutter-App (flutter/mitglieder). Die native Kotlin-App (members-android)
# liegt noch im Repo, wird aber nicht mehr gebaut.
#
# Tag members-vX.Y.Z  ->  Analyse + Tests, signiertes AAB + APK,
# Upload in den internen Test-Track von Google Play (als Update von
# com.fwv.members), danach Hochstufen in den geschlossenen Test (alpha),
# GitHub-Release und rollender Zeiger members-latest.
# Ablauf und Voraussetzungen: docs/flutter-mitglieder-app-plan.md (Release)
# und docs/play-console-setup.md.
#
# Daneben dieselbe App als Desktop-Programm (docs/flutter-desktop.md):
# Linux (.deb + .tar.gz), Windows (Installer .exe), macOS (.dmg + .zip,
# unsigniert).
# Diese Jobs haengen nicht am Android-Build - schlaegt einer fehl, geht das
# Android-Release trotzdem raus. Angehaengt werden die Dateien erst, wenn
# das GitHub-Release aus "build" steht (Job desktop-release).

on:
  push:
    tags:
      - 'members-v*'
  workflow_dispatch:
    inputs:
      create_release:
        description: 'GitHub-Release erstellen (ohne Play-Upload)'
        required: false
        default: false
        type: boolean
      version:
        description: 'Versionsnummer (z.B. 1.0.0)'
        required: false
        default: '1.0.0'
        type: string

jobs:
  test:
    name: Analyse und Tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        paket: [fwv_core, fwv_anlass, fwv_lager, fwv_roterschopf, mitglieder]
    defaults:
      run:
        working-directory: flutter/${{ matrix.paket }}
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - name: Abhaengigkeiten
        run: flutter pub get

      - name: Analyse
        run: flutter analyze

      - name: Tests
        run: flutter test

  build:
    name: Release bauen und verteilen
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: flutter/mitglieder

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      # Versionsname aus dem Tag (members-v1.2.3 -> 1.2.3), Versionscode mit
      # derselben Formel wie frueher bei members-android:
      # MAJOR*10000 + MINOR*100 + PATCH. Play verlangt, dass er steigt —
      # die letzte native Fassung war members-v0.42.0 (4200).
      - name: Version bestimmen
        env:
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ "$REF" == refs/tags/members-v* ]]; then
            VERSION="${REF_NAME#members-v}"
          else
            VERSION="${INPUT_VERSION:-0.0.0}"
          fi
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version '$VERSION' ist nicht X.Y.Z"
            exit 1
          fi
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
          VCODE=$(( MAJOR * 10000 + MINOR * 100 + PATCH ))
          [ "$VCODE" -lt 1 ] && VCODE=1
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "VCODE=$VCODE" >> "$GITHUB_ENV"
          echo "Version: $VERSION (Code $VCODE)"

      # Derselbe Upload-Schluessel wie bei members-android (Alias members),
      # sonst lehnt Play das Bundle als Update von com.fwv.members ab.
      # android/app/build.gradle.kts liest die MEMBERS_*-Variablen.
      - name: Signier-Schluessel bereitstellen
        env:
          KEYSTORE_BASE64: ${{ secrets.MEMBERS_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.MEMBERS_KEYSTORE_PASSWORD }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_BASE64" ]; then
            if [[ "$REF" == refs/tags/members-v* ]]; then
              echo "::error::Secret MEMBERS_KEYSTORE_BASE64 fehlt — ein mit dem Debug-Schluessel signiertes Release taugt nicht fuer Play."
              exit 1
            fi
            echo "::warning::Kein Keystore — Build wird mit dem Debug-Schluessel signiert."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/members.jks"
          {
            echo "MEMBERS_KEYSTORE_PATH=$RUNNER_TEMP/members.jks"
            echo "MEMBERS_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "MEMBERS_KEY_ALIAS=members"
          } >> "$GITHUB_ENV"

      - name: Abhaengigkeiten
        run: flutter pub get

      - name: App-Bundle bauen (Play Store)
        run: flutter build appbundle --release --build-name "$VERSION" --build-number "$VCODE"

      - name: APK bauen (GitHub-Release, Direktinstallation)
        run: flutter build apk --release --build-name "$VERSION" --build-number "$VCODE"

      - name: Dateien umbenennen
        run: |
          set -euo pipefail
          cp build/app/outputs/bundle/release/app-release.aab "$GITHUB_WORKSPACE/members-${VERSION}-release.aab"
          cp build/app/outputs/flutter-apk/app-release.apk "$GITHUB_WORKSPACE/members-${VERSION}-release.apk"

      - name: Artefakte sichern
        uses: actions/upload-artifact@v4
        with:
          name: members-release
          path: |
            members-*-release.apk
            members-*-release.aab
            flutter/mitglieder/build/app/outputs/mapping/release/mapping.txt
          retention-days: 30
          if-no-files-found: error

      - name: GitHub-Release erstellen
        if: startsWith(github.ref, 'refs/tags/members-v') || inputs.create_release == true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('members-v{0}', inputs.version) }}
          name: FWV Raura Mitglieder ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('members-v{0}', inputs.version) }}
          # NIE als "Latest" markieren: releases/latest gehoert dem Desktop-Auto-
          # Updater (latest.json) — Android-Releases wuerden ihn sonst kapern.
          make_latest: false
          generate_release_notes: true
          files: |
            members-*-release.apk
            members-*-release.aab
          body: |
            ## FWV Raura Mitglieder-App

            App für Mitglieder und Veranstaltungs-Organisatoren des
            Feuerwehrvereins Raura (Flutter-Fassung, ersetzt die bisherige
            native App als Update).

            **Kompatibilität:** Android 8.0+ (API 26)

            ### Installation

            Regulär über Google Play (interner Test). Alternativ:

            1. APK auf das Android-Gerät übertragen
            2. "Unbekannte Quellen" in den Einstellungen erlauben
            3. APK installieren
            4. Anmelden mit dem Mitgliederkonto oder per QR-Code
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Play-Zugang pruefen
        id: play
        if: startsWith(github.ref, 'refs/tags/members-v')
        env:
          PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$PLAY_JSON" ]; then
            echo "vorhanden=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Secret PLAY_SERVICE_ACCOUNT_JSON fehlt — kein Play-Upload."
          fi

      # Absichtlich als letzter Schritt und ohne continue-on-error: Schlaegt
      # der Upload fehl, ist der Lauf rot, GitHub-Release und APK gibt es
      # trotzdem schon. Store-Eintrag (Texte, Bilder) wird nicht angefasst.
      # Play zeigt Versionshinweise in der Sprache des Handys oder in der
      # Standardsprache der App - und die ist de-DE, nicht de-CH. Nur mit
      # de-CH blieb "Was ist neu" deshalb leer. Gepflegt wird nur die
      # de-CH-Datei; de-DE ist eine Kopie.
      - name: Versionshinweise auch fuer de-DE
        working-directory: ${{ github.workspace }}
        run: cp flutter/mitglieder/play/whatsnew/whatsnew-de-CH flutter/mitglieder/play/whatsnew/whatsnew-de-DE

      - name: Upload in Google Play (interner Test)
        if: steps.play.outputs.vorhanden == 'true'
        uses: r0adkll/upload-google-play@v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.fwv.members
          releaseFiles: members-${{ env.VERSION }}-release.aab
          releaseName: ${{ env.VERSION }}
          tracks: internal
          status: completed
          whatsNewDirectory: flutter/mitglieder/play/whatsnew
          mappingFile: flutter/mitglieder/build/app/outputs/mapping/release/mapping.txt

      # Gleiches Bundle zusaetzlich in den geschlossenen Test (alpha), damit
      # die Tester-Liste dort jedes Release ohne Klick in der Play Console
      # bekommt. Produktion bleibt bewusst Handarbeit.
      - name: Hochstufen in den geschlossenen Test (alpha)
        if: steps.play.outputs.vorhanden == 'true'
        env:
          PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          pip install --quiet google-auth requests
          python3 "$GITHUB_WORKSPACE/.github/scripts/play-hochstufen.py" com.fwv.members "$VCODE" internal alpha

      # DEUTSCH: Die APK fuer Website und GitHub ist die, die Google Play selbst
      # signiert hat (Play App Signing, Schluessel EF:99:A7:...), nicht unsere
      # mit dem Upload-Schluessel (00:66:28:...). Nur so passen App-ID UND
      # Signatur: die APK laesst sich ueber eine Play-Installation installieren
      # und Play kann eine APK-Installation aktualisieren. Ohne Play-Zugang
      # bleibt die selbst signierte APK (mit Warnung).
      - name: Von Play signierte APK holen
        if: (startsWith(github.ref, 'refs/tags/members-v') || inputs.create_release == true) && steps.play.outputs.vorhanden == 'true'
        working-directory: ${{ github.workspace }}
        env:
          PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          pip install --quiet google-auth requests
          python3 .github/scripts/play-apk.py laden com.fwv.members "$VCODE" "members-${VERSION}-release.apk"
          gh release upload "members-v${VERSION}" "members-${VERSION}-release.apk" --clobber

      - name: Ohne Play-Zugang - selbst signierte APK
        if: (startsWith(github.ref, 'refs/tags/members-v') || inputs.create_release == true) && steps.play.outputs.vorhanden != 'true'
        run: echo "::warning::Ohne Play-Zugang ist die APK mit dem Upload-Schluessel signiert und laesst sich nicht ueber eine Play-Installation installieren."

      # DEUTSCH: Rollender Zeiger auf die jeweils neuste Fassung.
      #
      # Warum ueberhaupt: Die Release-Datei traegt die Versionsnummer im
      # Namen, ein Link darauf veraltet also mit jedem Release. Gedruckte
      # Anleitungen und QR-Codes brauchen aber eine Adresse, die bleibt.
      # `releases/latest` scheidet aus — die gehoert dem Desktop-Updater
      # (siehe make_latest oben). Also ein eigener Tag mit gleichbleibendem
      # Dateinamen:
      #
      #   .../releases/download/members-latest/members-latest.apk
      #
      # Als Vorabversion markiert, damit GitHub sie nicht zur "Latest
      # release" des Repos macht und dem Desktop-Updater dazwischenfunkt.
      - name: Rollenden Zeiger "members-latest" aktualisieren
        if: startsWith(github.ref, 'refs/tags/members-v') || inputs.create_release == true
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cp "members-${VERSION}-release.apk" members-latest.apk
          # Daran erkennt eine aeltere APK-Fassung (bis 1.0.26), dass es eine
          # neuere gibt (flutter/mitglieder/lib/einstellungen/app_update.dart).
          # Geladen wird von der Website, nicht von GitHub: GitHubs Download
          # blieb auf manchen Handys haengen (Skill fwv-app-downloads). Ab
          # 1.0.27 liest die App ohnehin /download/versionen.json.
          APK_URL="https://www.fwv-raura.ch/download/mitglieder.apk"
          printf '{"version":"%s","versionCode":%s,"apk":"%s"}\n' "$VERSION" "$VCODE" "$APK_URL" > members-latest.json

          NOTES="Dieser Eintrag zeigt immer auf die neuste Fassung der
          Mitglieder-App. Der Dateiname bleibt gleich, damit Links und
          QR-Codes in den Anleitungen nicht veralten.

          Aktuell ausgeliefert: **${VERSION}**

          Direktlink:
          https://github.com/${GITHUB_REPOSITORY}/releases/download/members-latest/members-latest.apk"

          if gh release view members-latest >/dev/null 2>&1; then
            gh release upload members-latest members-latest.apk members-latest.json --clobber
            gh release edit members-latest --notes "$NOTES"
          else
            gh release create members-latest members-latest.apk members-latest.json \
              --title "Mitglieder-App — neuste Fassung" \
              --notes "$NOTES" \
              --prerelease \
              --target "$GITHUB_SHA"
          fi

  # ---------------------------------------------------------------------
  # Desktop-Programm (ersetzt vorstand-desktop)

  # Gebaut auf ubuntu-latest (24.04, glibc 2.39): laeuft auf Ubuntu 24.04+,
  # Debian 13 und aehnlich neuen Systemen. ubuntu-22.04 wird bei GitHub
  # gerade abgekuendigt (Brownouts), darum nicht aelter.
  desktop-linux:
    name: Desktop Linux
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter/mitglieder
    steps:
      - uses: actions/checkout@v4

      - name: Version bestimmen
        shell: bash
        env:
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ "$REF" == refs/tags/members-v* ]]; then
            VERSION="${REF_NAME#members-v}"
          else
            VERSION="${INPUT_VERSION:-0.0.0}"
          fi
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version '$VERSION' ist nicht X.Y.Z"
            exit 1
          fi
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
          VCODE=$(( MAJOR * 10000 + MINOR * 100 + PATCH ))
          [ "$VCODE" -lt 1 ] && VCODE=1
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "VCODE=$VCODE" >> "$GITHUB_ENV"

      - name: Linux-Bauwerkzeuge
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev \
            libstdc++-12-dev libsecret-1-dev

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - name: Bauen
        run: |
          flutter pub get
          flutter build linux --release --build-name "$VERSION" --build-number "$VCODE"

      - name: Pakete (.tar.gz, .deb)
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/desktop"
          tar -C build/linux/x64/release -czf "$GITHUB_WORKSPACE/desktop/fwv-raura-${VERSION}-linux-x64.tar.gz" \
            --transform "s,^bundle,fwv-raura-${VERSION}," bundle
          linux/packaging/deb-bauen.sh "$VERSION" "$GITHUB_WORKSPACE/desktop/fwv-raura_${VERSION}_amd64.deb"
          dpkg-deb --info "$GITHUB_WORKSPACE/desktop/fwv-raura_${VERSION}_amd64.deb"

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-linux
          path: desktop/*
          retention-days: 30
          if-no-files-found: error

  desktop-windows:
    name: Desktop Windows
    needs: test
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
        working-directory: flutter/mitglieder
    steps:
      - uses: actions/checkout@v4

      - name: Version bestimmen
        shell: bash
        env:
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ "$REF" == refs/tags/members-v* ]]; then
            VERSION="${REF_NAME#members-v}"
          else
            VERSION="${INPUT_VERSION:-0.0.0}"
          fi
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version '$VERSION' ist nicht X.Y.Z"
            exit 1
          fi
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
          VCODE=$(( MAJOR * 10000 + MINOR * 100 + PATCH ))
          [ "$VCODE" -lt 1 ] && VCODE=1
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "VCODE=$VCODE" >> "$GITHUB_ENV"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - name: Bauen
        run: |
          flutter pub get
          flutter build windows --release --build-name "$VERSION" --build-number "$VCODE"

      # Die Laufzeit von Visual C++ mitliefern - sonst startet das Programm
      # auf Rechnern ohne "VC++ Redistributable" nicht.
      - name: Laufzeit beilegen
        run: |
          set -euo pipefail
          OUT=build/windows/x64/runner/Release
          for dll in msvcp140.dll vcruntime140.dll vcruntime140_1.dll; do
            cp "/c/Windows/System32/$dll" "$OUT/"
          done

      # Installer (.exe) mit Inno Setup statt .zip - auf windows-latest
      # vorinstalliert. Skript: flutter/packaging/windows-setup.iss. In
      # PowerShell, weil Git-Bash "/D..." fuer einen Pfad haelt.
      - name: Installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; }
          New-Item -ItemType Directory -Force "$env:GITHUB_WORKSPACE\desktop" | Out-Null
          & $iscc /Q "/DAppName=FWV Raura" "/DAppId={{e6677bca-e80e-4818-bd08-2c51fdf0a91e}" "/DExeName=fwv_mitglieder.exe" `
            "/DVersion=$env:VERSION" "/DQuelle=$PWD\build\windows\x64\runner\Release" `
            "/DSymbol=$PWD\windows\runner\resources\app_icon.ico" `
            "/DZiel=$env:GITHUB_WORKSPACE\desktop" "/DDatei=fwv-raura-$env:VERSION-windows-x64-setup" `
            "$env:GITHUB_WORKSPACE\flutter\packaging\windows-setup.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem "$env:GITHUB_WORKSPACE\desktop"

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-windows
          path: desktop/*
          retention-days: 30
          if-no-files-found: error

  # Unsigniert (kein Apple-Entwicklerkonto fuer Developer ID): beim ersten
  # Start Rechtsklick -> Oeffnen, siehe docs/flutter-desktop.md.
  desktop-macos:
    name: Desktop macOS
    needs: test
    runs-on: macos-latest
    defaults:
      run:
        working-directory: flutter/mitglieder
    steps:
      - uses: actions/checkout@v4

      - name: Version bestimmen
        shell: bash
        env:
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ "$REF" == refs/tags/members-v* ]]; then
            VERSION="${REF_NAME#members-v}"
          else
            VERSION="${INPUT_VERSION:-0.0.0}"
          fi
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version '$VERSION' ist nicht X.Y.Z"
            exit 1
          fi
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
          VCODE=$(( MAJOR * 10000 + MINOR * 100 + PATCH ))
          [ "$VCODE" -lt 1 ] && VCODE=1
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "VCODE=$VCODE" >> "$GITHUB_ENV"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - name: Bauen
        run: |
          flutter pub get
          flutter build macos --release --build-name "$VERSION" --build-number "$VCODE"

      # Festes Zertifikat statt ad hoc: sonst fragt macOS nach jedem Update
      # nach dem Schluesselbund-Passwort (flutter/packaging/signieren-macos.sh).
      # Ohne Secrets bleibt es bei ad hoc - der Build laeuft trotzdem.
      - name: Signieren
        env:
          MACOS_SIGNATUR_P12: ${{ secrets.MACOS_SIGNATUR_P12 }}
          MACOS_SIGNATUR_PASSWORT: ${{ secrets.MACOS_SIGNATUR_PASSWORT }}
        run: |
          if [ -z "$MACOS_SIGNATUR_P12" ]; then
            echo "::warning::MACOS_SIGNATUR_P12 fehlt - App bleibt ad hoc signiert"
          else
            ../packaging/signieren-macos.sh "build/macos/Build/Products/Release/FWV Raura.app" macos/Runner/Release.entitlements
          fi

      - name: Zip und DMG
        run: |
          set -euo pipefail
          APP="build/macos/Build/Products/Release/FWV Raura.app"
          mkdir -p "$GITHUB_WORKSPACE/desktop" dmg
          ditto -c -k --keepParent "$APP" "$GITHUB_WORKSPACE/desktop/fwv-raura-${VERSION}-macos.zip"
          cp -R "$APP" dmg/
          ln -s /Applications dmg/Programme
          hdiutil create -volname "FWV Raura" -srcfolder dmg -ov -format UDZO \
            "$GITHUB_WORKSPACE/desktop/fwv-raura-${VERSION}-macos.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-macos
          path: desktop/*
          retention-days: 30
          if-no-files-found: error

  # Erst wenn das Release aus "build" steht: Dateien anhaengen und den
  # rollenden Zeiger members-latest mit festen Dateinamen ergaenzen (fuer
  # Links in Anleitungen). Der Update-Hinweis der Desktop-App liest die
  # members-latest.json aus "build" und fuehrt zur Release-Seite.
  desktop-release:
    name: Desktop-Dateien ans Release
    needs: [build, desktop-linux, desktop-windows, desktop-macos]
    if: startsWith(github.ref, 'refs/tags/members-v') || inputs.create_release == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: desktop
          merge-multiple: true

      - name: Anhaengen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('members-v{0}', inputs.version) }}
        run: |
          set -euo pipefail
          ls -la desktop
          gh release upload "$TAG" desktop/* --clobber

          NOTES="$(gh release view "$TAG" --json body --jq .body)"
          if ! grep -q "### Desktop" <<< "$NOTES"; then
            printf '%s\n\n%s\n' "$NOTES" "### Desktop (Linux, Windows, macOS)

          - **Linux (Ubuntu 24.04+, Debian 13):** \`.deb\` installieren
            (\`sudo apt install ./fwv-raura_*.deb\`) oder \`.tar.gz\` entpacken
            und \`fwv_mitglieder\` starten. Braucht libsecret und einen
            Schlüsselbund (GNOME-Schlüsselbund oder KWallet).
          - **Windows 10/11:** \`…-setup.exe\` ausführen (ohne Administratorrechte).
            Nicht signiert: SmartScreen → «Weitere Informationen» → «Trotzdem ausführen».
          - **macOS 12+:** \`.dmg\` öffnen, «FWV Raura» in Programme ziehen.
            Unsigniert: beim ersten Start Rechtsklick → Öffnen." > notes.md
            gh release edit "$TAG" --notes-file notes.md
          fi

          # Feste Namen unter members-latest
          if gh release view members-latest >/dev/null 2>&1; then
            cd desktop
            cp fwv-raura_*_amd64.deb ../members-latest-linux-amd64.deb
            cp fwv-raura-*-linux-x64.tar.gz ../members-latest-linux-x64.tar.gz
            cp fwv-raura-*-windows-x64-setup.exe ../members-latest-windows-x64-setup.exe
            cp fwv-raura-*-macos.dmg ../members-latest-macos.dmg
            cd ..
            gh release upload members-latest members-latest-linux-amd64.deb \
              members-latest-linux-x64.tar.gz members-latest-windows-x64-setup.exe \
              members-latest-macos.dmg --clobber
          fi
