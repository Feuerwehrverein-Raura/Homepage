name: Build Android Kitchen Display

# Kuechendisplay (Flutter, flutter/kueche) - ab kds-v4.0, November 2026.
# Ersetzt die native App (simple-order-system/kitchen-display-android, bis
# kds-v3.4) mit gleicher Paket-ID ch.fwvraura.kitchendisplay.
#
# Release: Tag kds-vX.Y[.Z] pushen -> signiertes APK am GitHub-Release; der
# Vereinsserver legt es unter www.fwv-raura.ch/download/kueche.apk ab
# (docker/app-downloads/holen.sh, sucht «-release.apk»). Die Tablets
# (alte wie neue App) finden es ueber versionen.json und installieren es
# nach einem Tipp auf die blaue Leiste.
#
# Wichtig: Das Release-APK MUSS mit dem Schluessel aus KEYSTORE_BASE64 (Alias
# kds) signiert sein - gleicher Schluessel wie alle bisherigen Releases, sonst
# laesst Android das Update nicht ueber die installierte App installieren.
# Fehlt das Secret, bricht der Release-Build ab. versionCode = X*1000+Y*100+Z
# (muss ueber 3400 liegen, sonst gilt 4.x als aelter als 3.4).

on:
  push:
    paths:
      - 'flutter/kueche/**'
      - '.github/workflows/build-android-kds.yml'
    branches:
      - main
    tags:
      - 'kds-v*'
  pull_request:
    paths:
      - 'flutter/kueche/**'
      - '.github/workflows/build-android-kds.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: flutter/kueche

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - name: Version bestimmen
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/kds-v* ]]; then
            VERSION="${{ github.ref_name }}"; VERSION="${VERSION#kds-v}"
          else
            VERSION=$(grep -oP '^version: \K[0-9.]+' pubspec.yaml)
          fi
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
          VCODE=$(( ${MAJOR:-0} * 1000 + ${MINOR:-0} * 100 + ${PATCH:-0} ))
          if [ "$VCODE" -le 3400 ]; then
            echo "::error::versionCode $VCODE nicht ueber 3400 (kds-v3.4) - die Tablets wuerden nicht aktualisieren."
            exit 1
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "VCODE=$VCODE" >> $GITHUB_ENV
          echo "Version: $VERSION (code: $VCODE)"

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      - name: Release-APK bauen
        run: flutter build apk --release --build-name="$VERSION" --build-number="$VCODE"

      - name: Release-APK signieren
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          IS_RELEASE: ${{ startsWith(github.ref, 'refs/tags/kds-v') }}
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          mkdir -p "$GITHUB_WORKSPACE/out"
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            if [ "$IS_RELEASE" = "true" ]; then
              echo "::error::KEYSTORE_BASE64/KEYSTORE_PASSWORD fehlen - kein unsigniertes Release."
              exit 1
            fi
            echo "Keine Signatur-Secrets - nur Testbuild."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/kds.jks"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/zipalign" -f -p 4 "$APK" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/kds.jks" \
            --ks-pass "pass:$KEYSTORE_PASSWORD" --ks-key-alias kds \
            --key-pass "pass:$KEYSTORE_PASSWORD" \
            --out "$GITHUB_WORKSPACE/out/kitchen-display-${VERSION}-release.apk" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" verify --print-certs "$GITHUB_WORKSPACE/out/kitchen-display-${VERSION}-release.apk" | head -3
          rm -f "$RUNNER_TEMP/kds.jks"

      - uses: actions/upload-artifact@v4
        with:
          name: kitchen-display-${{ env.VERSION }}
          path: out/*.apk
          retention-days: 30
          if-no-files-found: ignore

      - name: Release erstellen
        if: startsWith(github.ref, 'refs/tags/kds-v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Küchendisplay ${{ env.VERSION }}
          # NIE als "Latest": releases/latest gehoert dem Desktop-Updater
          make_latest: false
          body: |
            ## Küchendisplay ${{ env.VERSION }}

            Küchen-/Bar-Anzeige für das Bestellsystem (Flutter). Im Schopf direkt
            am T400, sonst über die Cloud.

            **Kompatibilität:** Android 7.0+ (API 24)

            Installierte Geräte (ab 3.0) zeigen neue Versionen selbst an – ein Tipp
            auf die blaue Leiste installiert sie. Anmeldung und Station bleiben.

            Download: https://www.fwv-raura.ch/download/kueche.apk
          files: out/kitchen-display-*-release.apk
          draft: false
