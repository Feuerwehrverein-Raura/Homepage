name: Play anzeigen

# Zeigt, was Google Play fuer die Mitglieder-App gespeichert hat (Tracks,
# Releases, Versionshinweise je Sprache). Liest nur.

on:
  workflow_dispatch:

jobs:
  zeigen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Anzeigen
        env:
          PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          pip install --quiet google-auth requests
          python3 .github/scripts/play-zeigen.py com.fwv.members
