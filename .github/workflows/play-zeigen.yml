name: Play anzeigen

# Zeigt, was Google Play fuer die Mitglieder-App gespeichert hat (Tracks,
# Releases, Versionshinweise je Sprache). Liest nur.

on:
  workflow_dispatch:
    inputs:
      version_code:
        description: 'versionCode fuer die Play-Signatur (leer = nur Tracks)'
        required: false

jobs:
  zeigen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Anzeigen
        env:
          PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          pip install --quiet google-auth requests
          python3 .github/scripts/play-zeigen.py com.fwv.members
      - name: Signatur der von Play erzeugten APK
        if: inputs.version_code != ''
        env:
          PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          pip install --quiet google-auth requests
          python3 .github/scripts/play-apk.py zeigen com.fwv.members "${{ inputs.version_code }}"
