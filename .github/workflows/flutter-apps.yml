name: Flutter-Apps

# Die Flutter-Apps, die die nativen Apps ersetzen (docs/flutter-entscheidung.md):
# flutter/fwv_core (gemeinsamer Kern), flutter/fwv_anlass (Anlass-Verwaltung
# mit Oberflaeche, Organisator + Vorstand), flutter/fwv_lager (Lager mit
# Oberflaeche, beide Apps), flutter/fwv_roterschopf (Licht und Tiefkuehler
# im Roten Schopf, Vertrag aus docker/backend-members/test/fixtures),
# flutter/mitglieder (Mitglieder + Organisatoren), flutter/musik (Musik des
# Roten Schopfs als Desktop-Programm, docs/flutter-musik-desktop.md),
# spaeter flutter/vorstand. Laeuft auch, wenn sich der Vertrag des Backends
# aendert — der Kern testet gegen dieselben Dateien. Die Vertraege der
# Inventar-API (flutter/fwv_lager/test/fixtures/inventar-api.json und
# ausleihe-api.json) prueft zusaetzlich der Backend-Test in tests.yml
# (Inventar-Backend).

on:
  push:
    branches: [main]
    paths:
      - 'flutter/**'
      - 'docker/backend-events/test/fixtures/**'
      - 'docker/backend-members/test/fixtures/**'
      - '.github/workflows/flutter-apps.yml'
  pull_request:
    paths:
      - 'flutter/**'
      - 'docker/backend-events/test/fixtures/**'
      - 'docker/backend-members/test/fixtures/**'
      - '.github/workflows/flutter-apps.yml'
  workflow_dispatch:

jobs:
  test:
    name: Analyse und Tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        paket: [fwv_core, fwv_anlass, fwv_lager, fwv_roterschopf, fwv_vorstand, mitglieder, musik]
    defaults:
      run:
        working-directory: flutter/${{ matrix.paket }}
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - name: Abhaengigkeiten
        run: flutter pub get

      - name: Analyse
        run: flutter analyze

      - name: Tests (Kern inkl. Vertrag mit dem Backend)
        run: flutter test

  android:
    name: Mitglieder-App Android (debug)
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter/mitglieder
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - name: APK bauen
        run: flutter build apk --debug

  # Compile-Check des Desktop-Programms (Linux zuerst, docs/flutter-desktop.md).
  # Debug reicht: es geht nur darum, dass der native Teil und die Plugins
  # (libsecret fuer den Schluesselbund) auf Linux bauen.
  linux:
    name: Mitglieder-App Linux (debug)
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter/mitglieder
    steps:
      - uses: actions/checkout@v4

      - name: Linux-Bauwerkzeuge
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev \
            libstdc++-12-dev libsecret-1-dev

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - name: Linux bauen
        run: flutter build linux --debug

  # Dasselbe fuer FWV Musik - zusaetzlich mit libmpv (just_audio_media_kit).
  musik-linux:
    name: Musik-App Linux (debug)
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter/musik
    steps:
      - uses: actions/checkout@v4

      - name: Linux-Bauwerkzeuge
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev \
            libstdc++-12-dev libsecret-1-dev libmpv-dev

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - name: Linux bauen
        run: flutter build linux --debug
