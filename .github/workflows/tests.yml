name: Tests

# Backends (Events, Inventar — je mit echter Postgres-Datenbank; Members ohne)
# und Website.
#
# Laeuft bei Pull Requests selbst; bei Pushes auf main ruft
# build-containers.yml diesen Workflow auf und baut/deployt erst, wenn er
# gruen ist. Die Apps testen ihren Teil des Arbeitsplan-Vertrags in ihren
# eigenen Workflows.

on:
  pull_request:
  workflow_call:
  workflow_dispatch:

jobs:
  musik-python:
    # spotDL-Dienst (docker/musik-dl) und Spiegel des Laptops
    # (roterschopf-kiosk/bin/kiosk-abgleich) - ohne Netz, nur Python.
    name: Musik (spotDL-Dienst, Laptop-Spiegel)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: musik-dl
        run: python -m unittest discover -s docker/musik-dl/test -v
      - name: kiosk-abgleich
        run: python -m unittest discover -s roterschopf-kiosk/test -v

  backend-events:
    name: Backend Events
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: fwvtest
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Abhaengigkeiten
        working-directory: docker/backend-events
        run: npm install --no-audit --no-fund

      - name: Syntax
        working-directory: docker/backend-events
        run: node --check src/index.js

      - name: Tests (mit Datenbank)
        working-directory: docker/backend-events
        env:
          TEST_DATABASE_URL: postgres://test:test@localhost:5432/fwvtest
        # nacheinander: mehrere Testdateien bauen die Datenbank neu auf
        run: node --test --test-concurrency=1 test/

  backend-members:
    name: Backend Members
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Abhaengigkeiten
        working-directory: docker/backend-members
        # kein package-lock im Repo (das Image installiert ebenfalls frisch)
        run: npm install --no-audit --no-fund --no-package-lock

      - name: Syntax
        working-directory: docker/backend-members
        run: node --check src/index.js

      - name: Tests
        working-directory: docker/backend-members
        # Gruppen der Mitglieder-Tokens und Token-Pruefung, gegen ein
        # nachgebautes Authentik (ohne Datenbank)
        run: npm test

  inventory-backend:
    name: Inventar-Backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: inventartest
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Abhaengigkeiten
        working-directory: simple-inventory-system/backend
        run: npm install --no-audit --no-fund

      - name: TypeScript und Tests (mit Datenbank)
        working-directory: simple-inventory-system/backend
        env:
          TEST_DATABASE_URL: postgres://test:test@localhost:5432/inventartest
        # npm test = tsc + node --test (Zugangsregeln, API und Ausleihe gegen
        # Postgres, Versand nachgebaut)
        run: npm test

  website:
    name: Website
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Tests
        run: node --test tests/
