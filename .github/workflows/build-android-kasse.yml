name: Build Android Kasse

# Native Kassen-App (Flutter, flutter/kasse), Oktober 2026.
# Release: Tag kasse-vX.Y[.Z] pushen -> signiertes APK am GitHub-Release; der
# Vereinsserver legt es unter www.fwv-raura.ch/download/kasse.apk ab
# (docker/app-downloads/holen.sh, Skill fwv-app-downloads).
#
# Signiert mit demselben Schluessel wie die Kuechen-App (Secrets
# KEYSTORE_BASE64/KEYSTORE_PASSWORD, Alias kds) - gleiche Paket-ID
# ch.fwvraura.kasse wie die fruehere Huelle kasse-v1.0, deshalb laesst sich
# 2.x direkt darueber installieren. versionCode = X*1000 + Y*100 + Z.

on:
  push:
    paths:
      - 'flutter/kasse/**'
      - '.github/workflows/build-android-kasse.yml'
    branches:
      - main
    tags:
      - 'kasse-v*'
  pull_request:
    paths:
      - 'flutter/kasse/**'
      - '.github/workflows/build-android-kasse.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: flutter/kasse

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - name: Version bestimmen
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/kasse-v* ]]; then
            VERSION="${{ github.ref_name }}"; VERSION="${VERSION#kasse-v}"
          else
            VERSION=$(grep -oP '^version: \K[0-9.]+' pubspec.yaml)
          fi
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
          VCODE=$(( ${MAJOR:-0} * 1000 + ${MINOR:-0} * 100 + ${PATCH:-0} ))
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "VCODE=$VCODE" >> $GITHUB_ENV
          echo "Version: $VERSION (code: $VCODE)"

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      - name: Release-APK bauen
        run: flutter build apk --release --build-name="$VERSION" --build-number="$VCODE"

      - name: Release-APK signieren
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          IS_RELEASE: ${{ startsWith(github.ref, 'refs/tags/kasse-v') }}
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          mkdir -p "$GITHUB_WORKSPACE/out"
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            if [ "$IS_RELEASE" = "true" ]; then
              echo "::error::KEYSTORE_BASE64/KEYSTORE_PASSWORD fehlen - kein unsigniertes Release."
              exit 1
            fi
            echo "Keine Signatur-Secrets - nur Testbuild."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/kds.jks"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/zipalign" -f -p 4 "$APK" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/kds.jks" \
            --ks-pass "pass:$KEYSTORE_PASSWORD" --ks-key-alias kds \
            --key-pass "pass:$KEYSTORE_PASSWORD" \
            --out "$GITHUB_WORKSPACE/out/kasse-${VERSION}-release.apk" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" verify --print-certs "$GITHUB_WORKSPACE/out/kasse-${VERSION}-release.apk" | head -3
          rm -f "$RUNNER_TEMP/kds.jks"

      - uses: actions/upload-artifact@v4
        with:
          name: kasse-${{ env.VERSION }}
          path: out/*.apk
          retention-days: 30
          if-no-files-found: ignore

      - name: Release erstellen
        if: startsWith(github.ref, 'refs/tags/kasse-v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Kassen-App ${{ env.VERSION }}
          # NIE als "Latest": releases/latest gehoert dem Desktop-Updater
          make_latest: false
          body: |
            ## Kassen-App ${{ env.VERSION }}

            Native Kasse des FWV Raura (Flutter): eine einzige App, laeuft auch
            im Single-App-Kiosk. Im Schopf direkt am T400, sonst ueber die Cloud.

            **Kompatibilität:** Android 7.0+ (API 24)

            Download: https://www.fwv-raura.ch/download/kasse.apk
          files: out/kasse-*-release.apk
          draft: false
